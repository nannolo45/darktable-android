# SPDX-License-Identifier: GPL-3.0-or-later
# Brief G0: engine (with the bridge) -> test APKs per ABI, published as
# release files -> instrumented test of the x86_64 APK on an API 33 emulator,
# compared with darktable-cli on Linux. Also runs the Linux bridge tests (S3)
# against the Linux reference build. Logs go to the ci-logs branch.
name: g0-app

on:
  push:
    branches: [g0-test-app, p1a-engine-core, p1c-engine-followups, hotfix-stale-lock, t1-stability, p3l-shared-styles-presets, p3m-retouch-lut]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      tests:
        description: "Bridge tests to run (for example C35 C36); empty = all"
        type: string
        default: ""

# nothing by default; jobs ask for what they need
permissions: {}

concurrency:
  group: g0-app-${{ github.ref }}
  cancel-in-progress: true

env:
  # the public test image and edit the emulator test uses (darktable-tests)
  G0_RAW: images/mire1.cr2
  G0_XMP: 0001-exposure/exposure.xmp

jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      deps_tag: ${{ steps.t.outputs.DEPS_TAG }}
      engine_tag: ${{ steps.t.outputs.ENGINE_TAG }}
      app_tag: ${{ steps.t.outputs.APP_TAG }}
      dt_commit: ${{ steps.t.outputs.DT_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: t
        run: tools/ci/tags.sh | tee -a "$GITHUB_OUTPUT"

  deps:
    permissions:
      contents: write
    uses: ./.github/workflows/deps.yml

  engine:
    needs: deps
    permissions:
      contents: write
    uses: ./.github/workflows/engine.yml

  linux:
    # Linux reference build of the same darktable commit, with the bridge built
    # from its build tree; S3 bridge tests; reference export for the emulator test
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write   # ci-logs branch
    env:
      DTA_WORK: /home/runner/dta-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Linux build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/dt-linux
          key: dt-linux-bridge-${{ needs.tag.outputs.dt_commit }}-${{ hashFiles('tools/build-engine-linux.sh', 'engine/CMakeLists.txt', 'engine/include/**', 'engine/src/**', 'engine/tests/CMakeLists.txt', 'engine/tests/dtb_test.c', 'engine/tests/dtb_test_p1b2.c', 'engine/tests/dtb_test_p3d.c', 'engine/tests/dtb_test_p3g.c', 'engine/tests/dtb_test_p3h.c', 'engine/tests/dtb_test_p3j.c', 'engine/tests/dtb_test_p3l.c', 'engine/tests/dtb_test_p3m.c', 'engine/tests/dtb_test_p3n.c', 'engine/tests/dtb_test_p4a.c', 'engine/tests/dtb_test_p4b.c', 'engine/tests/dtb_test_p4c.c', 'engine/tests/dtb_test_p4d.c', 'engine/tests/dtb_p3jref.c', 'engine/tests/dtb_pickref.c', 'engine/tests/pickref*') }}

      - name: Build darktable and the bridge for Linux
        id: build
        run: |
          start=$(date +%s)
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then
            tools/build-engine-linux.sh --deps-only
            echo "cached build"
          else
            tools/fetch-darktable.sh /home/runner/darktable
            tools/build-engine-linux.sh /home/runner/darktable /home/runner/dt-linux 2>&1 | tail -n 60
          fi
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          /home/runner/dt-linux/bin/darktable-cli --version | head -2
          ls -l /home/runner/dt-linux/bridge-build/libdtbridge.so /home/runner/dt-linux/bridge-build/tests/dtb_test

      - name: Save Linux build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/dt-linux
          key: dt-linux-bridge-${{ needs.tag.outputs.dt_commit }}-${{ hashFiles('tools/build-engine-linux.sh', 'engine/CMakeLists.txt', 'engine/include/**', 'engine/src/**', 'engine/tests/CMakeLists.txt', 'engine/tests/dtb_test.c', 'engine/tests/dtb_test_p1b2.c', 'engine/tests/dtb_test_p3d.c', 'engine/tests/dtb_test_p3g.c', 'engine/tests/dtb_test_p3h.c', 'engine/tests/dtb_test_p3j.c', 'engine/tests/dtb_test_p3l.c', 'engine/tests/dtb_test_p3m.c', 'engine/tests/dtb_test_p3n.c', 'engine/tests/dtb_test_p4a.c', 'engine/tests/dtb_test_p4b.c', 'engine/tests/dtb_test_p4c.c', 'engine/tests/dtb_test_p4d.c', 'engine/tests/dtb_p3jref.c', 'engine/tests/dtb_pickref.c', 'engine/tests/pickref*') }}

      - name: Fetch test images
        run: |
          tools/engine-test/fetch-paths.sh /home/runner/dtt \
            images/mire1.cr2 images/xtransIV.raf images/hlrecovery.arw \
            0001-exposure/exposure.xmp \
            0146-lens-metadata-xtransIV-modversion-7/lens-metadata-xtransIV-modversion-7.xmp \
            0179-spektrafilm/spektrafilm.xmp \
            0004-masks/masks.xmp 0081-mask-groups/mask-groups.xmp 0090-mask-combine/mask-combine.xmp \
            0144-masks-combine-sum/masks-combine-sum.xmp
          rm -rf /home/runner/dtt/.git-dtt

      - name: Reference export for the emulator test (darktable-cli, JPEG quality 95)
        run: |
          mkdir -p /home/runner/ref
          /home/runner/dt-linux/bin/darktable-cli "/home/runner/dtt/$G0_RAW" "/home/runner/dtt/$G0_XMP" /home/runner/ref/export.jpg \
            --core --configdir /tmp/cli-config --cachedir /tmp/cli-cache \
            --conf plugins/imageio/format/jpeg/quality=95 > /home/runner/ref/cli.log 2>&1
          ls -l /home/runner/ref

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g0-reference
          path: |
            /home/runner/ref
            /home/runner/dtt
          retention-days: 7

      - name: Bridge tests on Linux (S3 T1 to T9, X1; P1a C1 to C7; P1c C8)
        id: tests
        run: |
          set +e
          # brief P4b, C36: an OpenCL device on the CPU (PoCL) for the bridge's OpenCL path; run_tests.sh gives every
          # darktable-cli reference --disable-opencl, so the references stay CPU renders
          { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pocl-opencl-icd ocl-icd-libopencl1 clinfo; } > /tmp/pocl-install.log 2>&1 || echo "PoCL not installed"
          { clinfo -l; ls -l /etc/OpenCL/vendors/ /usr/lib/x86_64-linux-gnu/libOpenCL*; } > /tmp/clinfo.txt 2>&1 || true
          # brief P4b: a dispatch may name the tests to run (a diagnosis run); a full run leaves it empty
          engine/tests/run_tests.sh /home/runner/dt-linux/bridge-build /home/runner/dt-linux /home/runner/dtt /home/runner/bridge-tests ${{ inputs.tests }}
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          # P1a: every failure counts, T5 included (render_region has its margin now)
          failures=$(grep -c '^FAIL' /home/runner/bridge-tests/summary.txt)
          passes=$(grep -c '^PASS' /home/runner/bridge-tests/summary.txt)
          echo "passes=$passes failures=$failures"
          echo "other_failures=$failures" >> "$GITHUB_OUTPUT"
          echo "passes=$passes" >> "$GITHUB_OUTPUT"

      - name: Region test diagnosis (P1a; information only, does not fail the job)
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          # which module makes a region differ from the crop of the full render:
          # each history operation switched off in turn, demosaic passthrough,
          # and the internal margin at 0, 16, 64 and 256 px (engine/tests/t5_bisect.sh)
          D=/home/runner/dtt
          DEMOSAIC_PASSTHROUGH=DT_IOP_DEMOSAIC_PASSTHR_MONOX engine/tests/t5_bisect.sh /home/runner/dt-linux/bridge-build /home/runner/dt-linux \
            $D/images/xtransIV.raf $D/0146-lens-metadata-xtransIV-modversion-7/lens-metadata-xtransIV-modversion-7.xmp /home/runner/t5-raf \
            > /home/runner/t5-raf.txt 2>&1 || true
          engine/tests/t5_bisect.sh /home/runner/dt-linux/bridge-build /home/runner/dt-linux \
            $D/images/hlrecovery.arw $D/0179-spektrafilm/spektrafilm.xmp /home/runner/t5-arw \
            > /home/runner/t5-arw.txt 2>&1 || true
          cat /home/runner/t5-raf.txt /home/runner/t5-arw.txt

      - name: Render cost before and after (P1c item 5; information only, does not fail the job)
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          engine/tests/cost.sh /home/runner/dt-linux/bridge-build /home/runner/dt-linux /home/runner/dtt /home/runner/cost 3 \
            > /home/runner/cost.txt 2>&1 || true
          cat /home/runner/cost.txt

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          cp /home/runner/t5-raf.txt /home/runner/t5-arw.txt "$L/" 2>/dev/null || true
          cp /home/runner/cost.txt "$L/cost-summary.md" 2>/dev/null || true
          mkdir -p "$L/cost" && cp /home/runner/cost/*.out /home/runner/cost/*.err "$L/cost/" 2>/dev/null || true
          {
            echo "build_seconds: ${{ steps.build.outputs.seconds }}"
            echo "cache_hit: ${{ steps.cache.outputs.cache-hit }}"
            echo "runner_cores: $(nproc)"
            echo "bridge_tests_exit: ${{ steps.tests.outputs.rc }}"
            echo "bridge_tests_passes: ${{ steps.tests.outputs.passes }}"
            echo "bridge_tests_failures: ${{ steps.tests.outputs.other_failures }}"
          } > "$L/summary.txt"
          cp /home/runner/bridge-tests/summary.txt "$L/bridge-tests-summary.txt" 2>/dev/null || true
          cp /home/runner/bridge-tests/comparisons.txt "$L/bridge-tests-comparisons.txt" 2>/dev/null || true
          # brief P4b: C35 and C36 numbers, the OpenCL set-up of the runner
          cp /home/runner/bridge-tests/p4b_*.txt /home/runner/bridge-tests/p4d_*.txt /home/runner/bridge-tests/C4d.log /tmp/clinfo.txt /tmp/pocl-install.log "$L/" 2>/dev/null || true
          for c in cr2 raf arw; do
            mkdir -p "$L/$c"; cp /home/runner/bridge-tests/$c/*.log "$L/$c/" 2>/dev/null || true
          done
          cp /home/runner/ref/cli.log "$L/reference-cli.log" 2>/dev/null || true

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out g0-linux "${{ job.status }}-other_failures${{ steps.tests.outputs.other_failures }}"

      - name: Fail on any bridge test failure
        if: steps.tests.outputs.other_failures != '0' || steps.tests.outputs.rc != '0'
        run: exit 1

  apk:
    needs: [tag, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # release files, ci-logs branch
    env:
      ENGINE_TAG: ${{ needs.tag.outputs.engine_tag }}
      APP_TAG: ${{ needs.tag.outputs.app_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch both engine archives
        run: |
          mkdir -p /home/runner/engines
          for abi in arm64-v8a x86_64; do
            gh release download -R "$GITHUB_REPOSITORY" "$ENGINE_TAG" --pattern "engine-$abi.tar.gz" --pattern "engine-$abi-report.txt" --dir /home/runner/engines
            tar -xzf "/home/runner/engines/engine-$abi.tar.gz" -C /home/runner/engines
          done
          ls -l /home/runner/engines /home/runner/engines/engine-x86_64/lib | head -60

      - name: Android SDK packages and Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.22.1" > /tmp/sdkmanager.log 2>&1 || { tail -20 /tmp/sdkmanager.log; exit 1; }
          echo "GRADLE=$(tools/app/setup-gradle.sh /home/runner/gradle)" >> "$GITHUB_ENV"

      - name: Build the APKs (debug, one per ABI) and the instrumented test
        id: build
        run: |
          start=$(date +%s)
          cd app
          "$GRADLE" --no-daemon -Pdta.engineDir=/home/runner/engines -Pdta.versionName="$APP_TAG" \
            assembleArm64Debug assembleX86_64Debug assembleX86_64DebugAndroidTest 2>&1 | tee /tmp/gradle.log
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          mkdir -p /home/runner/apk
          cp g0/build/outputs/apk/arm64/debug/g0-arm64-debug.apk /home/runner/apk/dt-android-g0-arm64-v8a.apk
          cp g0/build/outputs/apk/x86_64/debug/g0-x86_64-debug.apk /home/runner/apk/dt-android-g0-x86_64.apk
          cp g0/build/outputs/apk/androidTest/x86_64/debug/g0-x86_64-debug-androidTest.apk /home/runner/apk/g0-x86_64-androidTest.apk

      - name: Check and measure the APKs
        run: |
          R=/home/runner/apk/apk-report.txt
          {
            echo "app tag: $APP_TAG"; echo "engine: $ENGINE_TAG"; echo "commit: $GITHUB_SHA"
            for abi in arm64-v8a x86_64; do
              a=/home/runner/apk/dt-android-g0-$abi.apk
              echo; echo "== $abi"
              echo "apk_bytes $(stat -c %s "$a")"
              unzip -l "$a" | awk '$4 ~ /^(lib\/|assets\/engine\/)/ {print "  " $1 "\t" $4}'
              # no RAW images and no keystores inside
              if unzip -l "$a" | grep -iE '\.(cr2|cr3|nef|arw|raf|dng|orf|rw2|pef|srw|jks|keystore)$'; then echo "FORBIDDEN FILE IN APK"; exit 1; fi
              # permissions: nothing is sent anywhere, so no network permission
              "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$a" | sed 's/^/  /'
              if "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$a" | grep -q 'android.permission.INTERNET'; then echo "INTERNET permission in APK"; exit 1; fi
              # the bridge must not be in lib/: it is loaded from the unpacked engine
              if unzip -l "$a" | grep -q 'lib/.*/libdtbridge.so'; then echo "libdtbridge.so in lib/"; exit 1; fi
              echo "  engine archive: $(stat -c %s /home/runner/engines/engine-$abi.tar.gz) bytes (tar.gz)"
              echo "  engine tree: $(du -sb /home/runner/engines/engine-$abi | cut -f1) bytes unpacked (with bin/darktable-cli, not packed)"
            done
          } | tee "$R"

      - name: Publish the APKs as release files
        run: |
          cd /home/runner/apk
          gh release view -R "$GITHUB_REPOSITORY" "$APP_TAG" >/dev/null 2>&1 || \
            gh release create -R "$GITHUB_REPOSITORY" "$APP_TAG" --prerelease --target "$GITHUB_SHA" --title "G0 test app $APP_TAG" \
              --notes "Diagnostic test app for gate G0 (brief G0), built from commit $GITHUB_SHA with engine $ENGINE_TAG. Unofficial port of darktable, debug build, not a darktable release. Phones: dt-android-g0-arm64-v8a.apk. Source: this repository at that commit (GPL-3.0-or-later)." || true
          gh release upload -R "$GITHUB_REPOSITORY" "$APP_TAG" dt-android-g0-arm64-v8a.apk dt-android-g0-x86_64.apk apk-report.txt --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g0-apks
          path: |
            /home/runner/apk/dt-android-g0-x86_64.apk
            /home/runner/apk/g0-x86_64-androidTest.apk
          retention-days: 7

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          echo "gradle_seconds: ${{ steps.build.outputs.seconds }}" > "$L/summary.txt"
          cp /home/runner/apk/apk-report.txt "$L/" 2>/dev/null || true
          cp /home/runner/engines/engine-*-report.txt "$L/" 2>/dev/null || true
          tail -n 200 /tmp/gradle.log > "$L/gradle.tail.log" 2>/dev/null || true
          grep -E "^e: |^w: |error:|warning:" /tmp/gradle.log > "$L/gradle-messages.log" 2>/dev/null || true

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out g0-apk "${{ job.status }}"

  emulator:
    needs: [apk, linux]
    if: ${{ !cancelled() && needs.apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # ci-logs branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g0-apks
          path: /home/runner/apk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g0-reference
          path: /home/runner/refart

      - name: Locate reference files
        run: |
          find /home/runner/refart -maxdepth 3 | head -20
          R=$(dirname "$(find /home/runner/refart -name export.jpg | head -1)")
          T=$(dirname "$(dirname "$(find /home/runner/refart -name mire1.cr2 | head -1)")")
          echo "REF=$R" >> "$GITHUB_ENV"; echo "DTT=$T" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented test in the emulator (API 33, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/app/emulator-g0.sh /home/runner/apk/dt-android-g0-x86_64.apk /home/runner/apk/g0-x86_64-androidTest.apk "$DTT/$G0_RAW" "$DTT/$G0_XMP" /home/runner/emu; echo $? > /home/runner/emu-rc.txt

      - name: Compare the export with darktable-cli on Linux
        id: compare
        run: |
          rc=$(cat /home/runner/emu-rc.txt 2>/dev/null || echo 1)
          echo "test_rc=$rc" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy python3-pil > /dev/null
          # accepted: same size and PSNR >= 40 dB (JPEG quality 95, clang +
          # newer libraries on Android vs gcc + Ubuntu's on Linux, as in S1)
          out=$(python3 -I engine/tests/compare.py /home/runner/emu/g0-test/export.jpg "$REF/export.jpg" --tolerance 255 2>&1) || true
          echo "$out" | tee /home/runner/emu/compare.txt
          psnr=$(echo "$out" | sed -n 's/.* psnr \([0-9.inf]*\).*/\1/p')
          ok=0
          if echo "$out" | grep -q '^size' && { [ "$psnr" = inf ] || awk "BEGIN{exit !($psnr >= 40)}"; }; then ok=1; fi
          echo "compare_ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          E=/home/runner/emu
          cp "$E/device.txt" "$E/instrument.txt" "$E/crashes.txt" "$E/timings.txt" "$E/compare.txt" "$L/" 2>/dev/null || true
          mkdir -p "$L/g0-test"
          for f in "$E"/g0-test/*; do
            case "$f" in *.jpg) ;; *) cp "$f" "$L/g0-test/" ;; esac
          done
          ls -l "$E/g0-test" > "$L/g0-test/files.txt" 2>/dev/null || true
          tail -n 3000 "$E/logcat.txt" > "$L/logcat-tail.txt" 2>/dev/null || true
          {
            echo "# G0 emulator test, run ${GITHUB_RUN_ID}"
            echo; echo "test exit: ${{ steps.compare.outputs.test_rc }}, export comparison ok: ${{ steps.compare.outputs.compare_ok }}"
            echo; echo '## device'; echo '```'; cat "$L/device.txt" 2>/dev/null; echo '```'
            echo; echo '## start'; echo '```'; cat "$L/g0-test/start-report.txt" 2>/dev/null; echo '```'
            echo; echo '## results'; echo '```'; cat "$L/g0-test/results.txt" 2>/dev/null; echo '```'
            echo; echo '## export vs darktable-cli (Linux)'; echo '```'; cat "$L/compare.txt" 2>/dev/null; echo '```'
            echo; echo '## benchmark'; echo '```'; cat "$L/g0-test/benchmark.txt" 2>/dev/null; echo '```'
            echo; echo '## timings'; echo '```'; cat "$L/timings.txt" 2>/dev/null; echo '```'
          } > "$L/REPORT.md"
          cat "$L/REPORT.md"

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out g0-emulator "${{ job.status }}-test${{ steps.compare.outputs.test_rc }}-compare${{ steps.compare.outputs.compare_ok }}"

      - name: Fail if the test or the comparison failed
        if: steps.compare.outputs.test_rc != '0' || steps.compare.outputs.compare_ok != '1'
        run: exit 1
