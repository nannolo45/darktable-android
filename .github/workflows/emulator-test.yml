# SPDX-License-Identifier: GPL-3.0-or-later
# Run darktable-cli from the x86_64 engine archive in an Android emulator
# (API 33) on public darktable-tests images and compare the renders with a
# Linux build of the same darktable commit (brief S1). Renders twice, with 1
# thread and with all threads, to show that OpenMP works.
name: emulator-test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      engine_tag: ${{ steps.t.outputs.ENGINE_TAG }}
      dt_commit: ${{ steps.t.outputs.DT_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: t
        run: tools/ci/tags.sh | tee -a "$GITHUB_OUTPUT"

  linux-reference:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DTA_WORK: /home/runner/dta-work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Linux build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/dt-linux
          key: dt-linux-${{ needs.tag.outputs.dt_commit }}-${{ hashFiles('tools/build-engine-linux.sh') }}

      - name: Build darktable for Linux (reference)
        id: build
        run: |
          start=$(date +%s)
          if [ "${{ steps.cache.outputs.cache-hit }}" = true ]; then
            tools/build-engine-linux.sh --deps-only
            echo "cached build"
          else
            tools/fetch-darktable.sh /home/runner/darktable
            tools/build-engine-linux.sh /home/runner/darktable /home/runner/dt-linux 2>&1 | tail -n 60
          fi
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          /home/runner/dt-linux/bin/darktable-cli --version | head -2

      - name: Save Linux build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/dt-linux
          key: dt-linux-${{ needs.tag.outputs.dt_commit }}-${{ hashFiles('tools/build-engine-linux.sh') }}

      - name: Render reference
        run: |
          tools/engine-test/fetch-tests.sh /home/runner/tests
          rm -rf /home/runner/tests/.git-dtt
          for th in 1 all; do
            sh tools/engine-test/run-renders.sh /home/runner/dt-linux /home/runner/tests /home/runner/ref/t$th $th
          done
          rm -rf /home/runner/ref/*/home /home/runner/ref/*/config /home/runner/ref/*/cache /home/runner/ref/*/tmp
          nproc > /home/runner/ref/cores.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-reference
          path: /home/runner/ref
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests
          path: /home/runner/tests
          retention-days: 7

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          echo "build_seconds: ${{ steps.build.outputs.seconds }}" > "$L/summary.txt"
          echo "cache_hit: ${{ steps.cache.outputs.cache-hit }}" >> "$L/summary.txt"
          echo "runner_cores: $(nproc)" >> "$L/summary.txt"
          for th in 1 all; do
            cp /home/runner/ref/t$th/results.tsv "$L/results-t$th.tsv" 2>/dev/null || true
            for f in /home/runner/ref/t$th/*.log; do [ -e "$f" ] && tail -n 30 "$f" > "$L/t$th-$(basename "$f")"; done
          done

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out linux-reference "${{ job.status }}"

  emulator:
    needs: [tag, linux-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ENGINE_TAG: ${{ needs.tag.outputs.engine_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch x86_64 engine release file
        run: |
          gh release download -R "$GITHUB_REPOSITORY" "$ENGINE_TAG" --pattern "engine-x86_64.tar.gz" --dir /home/runner \
            || { echo "no engine-x86_64.tar.gz in $ENGINE_TAG: run the engine workflow first"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-reference
          path: /home/runner/ref

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests
          path: /home/runner/tests

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run renders in the emulator (API 33, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/engine-test/emulator-run.sh /home/runner/engine-x86_64.tar.gz /home/runner/tests /home/runner/emu || true

      - name: Compare with Linux reference
        id: compare
        run: |
          python3 -m pip install -q numpy
          mkdir -p /tmp/ci-out
          rc=0
          for th in 1 all; do
            python3 tools/render-compare.py /home/runner/ref/tall /home/runner/emu/t$th --label "emulator-t$th" --out /tmp/ci-out/compare-emulator-t$th || rc=1
          done
          python3 tools/render-compare.py /home/runner/ref/tall /home/runner/ref/t1 --label "linux-t1" --out /tmp/ci-out/compare-linux-t1-vs-tall || true
          python3 tools/render-compare.py /home/runner/emu/tall /home/runner/emu/t1 --label "emulator-t1" --out /tmp/ci-out/compare-emulator-t1-vs-tall || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          E=/home/runner/emu
          cp "$E/device.txt" "$E/version.txt" "$E/crashes.txt" "$L/" 2>/dev/null || true
          tail -n 200 "$E/logcat-tail.txt" > "$L/logcat-tail.txt" 2>/dev/null || true
          for th in 1 all; do
            cp "$E/t$th/results.tsv" "$L/emulator-results-t$th.tsv" 2>/dev/null || true
            cp "$E/run-t$th.txt" "$L/" 2>/dev/null || true
            cp /home/runner/ref/t$th/results.tsv "$L/linux-results-t$th.tsv" 2>/dev/null || true
            for f in "$E"/t$th/*.log; do [ -e "$f" ] && tail -n 40 "$f" > "$L/emu-t$th-$(basename "$f")"; done
          done
          cp /home/runner/ref/cores.txt "$L/linux-cores.txt" 2>/dev/null || true
          {
            echo "# emulator-test run ${GITHUB_RUN_ID}"
            echo; echo "engine: $ENGINE_TAG"; echo
            echo '## device'; echo '```'; cat "$L/device.txt" 2>/dev/null; echo '```'
            for th in 1 all; do echo; echo "## emulator, threads=$th vs Linux (all threads)"; cat "$L/compare-emulator-t$th.md" 2>/dev/null || echo "(no comparison)"; done
            echo; echo "## Linux 1 thread vs Linux all threads"; cat "$L/compare-linux-t1-vs-tall.md" 2>/dev/null
            echo; echo "## emulator 1 thread vs emulator all threads"; cat "$L/compare-emulator-t1-vs-tall.md" 2>/dev/null
            echo; echo "## timings (ms)"; echo '```'
            paste "$L/emulator-results-t1.tsv" "$L/emulator-results-tall.tsv" 2>/dev/null
            echo '--- linux'
            paste "$L/linux-results-t1.tsv" "$L/linux-results-tall.tsv" 2>/dev/null
            echo '```'
          } > "$L/REPORT.md"
          cat "$L/REPORT.md"

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out emulator "${{ job.status }}-compare${{ steps.compare.outputs.rc }}"

      - name: Fail if a render is missing or differs in size
        if: steps.compare.outputs.rc != '0'
        run: exit 1
