# SPDX-License-Identifier: GPL-3.0-or-later
# Brief P2a: the app modules on the fake engine. Rule check, unit tests,
# JVM screenshot tests (phone and tablet), the interface preview APK. When
# everything passes, the APK and the screenshots are published as release
# files under a tag derived from the commit. Logs go to the ci-logs branch
# either way. No native code is built here. Brief P2d adds a check that
# schema/builtin-layouts.json is what tools/layouts/extract-builtin-layouts.py
# produces from the pinned upstream commit.
name: p2a-app

on:
  push:
    branches: [main, p2a-app-foundation, p2d-module-layouts, p2e-lpl-client, p2e-state-fix, p3d-masks-parametric]
    paths: ["app/**", "schema/**", "tools/app/**", "tools/layouts/**", "tools/schema-module-names.py", "tools/schema-unbound-controls.py", "tools/colorharmonizer-hue-tables.py", "tools/p2j-reference-vectors.py", "tools/p3a-crop-reference.py", "docs/experiments/P2j-results/**", ".github/workflows/p2a-app.yml"]
  workflow_dispatch:

# nothing by default; the job asks for what it needs
permissions: {}

concurrency:
  group: p2a-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # release files, ci-logs branch
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag
        run: echo "PREVIEW_TAG=app-preview-$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Android SDK packages, Gradle and the signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /tmp/sdkmanager.log 2>&1 || { tail -20 /tmp/sdkmanager.log; exit 1; }
          echo "GRADLE=$(tools/app/setup-gradle.sh /home/runner/gradle)" >> "$GITHUB_ENV"
          # Signing. With the repository secret SIGNING_KEYSTORE_B64 (the owner's key, a base64 keystore in the
          # debug-keystore form) every build has the same signature, so a newer build installs over an older one
          # and keeps its data. Without the secret a key is made here for this run only and never stored.
          # The owner added the secret on 19 Nov 2026. Gradle is told to use it with -Pdta.keystore (see app/app/build.gradle.kts).
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
            cp ~/.android/debug.keystore "$HOME/owner.keystore"
            echo "DTA_KEYSTORE_ARG=-Pdta.keystore=$HOME/owner.keystore" >> "$GITHUB_ENV"
            "$JAVA_HOME_17_X64/bin/keytool" -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null \
              || { echo "SIGNING_KEYSTORE_B64 is not a usable keystore"; exit 1; }
            echo "signing: owner key (secret of ${#SIGNING_KEYSTORE_B64} characters)" | tee /tmp/signing.txt
          else
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            echo "signing: temporary key for this run (this run was given no SIGNING_KEYSTORE_B64 secret)" | tee /tmp/signing.txt
          fi

      - name: Built-in module layouts match the pinned upstream (brief P2d)
        id: layouts
        # a fetch from github.com once hung for over 15 minutes (run 44497441293); bound it and retry
        timeout-minutes: 20
        run: |
          set -o pipefail
          PIN=$(git ls-tree HEAD upstream/darktable | awk '{print $3}')
          echo "upstream pin: $PIN"
          # Only the three files the tool reads, downloaded by commit. (Fetching the repository with git,
          # sparse or shallow, hung or timed out repeatedly on 19 Nov 2026 and stopped the preview build.)
          export DT_UPSTREAM_COMMIT="$PIN"
          for f in src/libs/modulegroups.c src/common/utility.c data/darktableconfig.xml.in; do
            mkdir -p "/tmp/dt-src/$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "/tmp/dt-src/$f" "https://raw.githubusercontent.com/darktable-org/darktable/$PIN/$f" \
              || { echo "could not download $f at $PIN"; exit 1; }
          done
          pkg-config --exists glib-2.0 || { sudo apt-get update -q >/dev/null && sudo apt-get install -y -q libglib2.0-dev >/dev/null; }
          python3 -I tools/layouts/extract-builtin-layouts.py /tmp/dt-src --check 2>&1 | tee /tmp/layouts-check.log

      - name: Module names for LightPhotoLibrary match the control schema (brief P2f, R15)
        run: python3 -I tools/schema-module-names.py --check

      - name: P2j tables and reference values are upstream's (brief P2j)
        timeout-minutes: 10
        run: |
          set -o pipefail
          PIN=$(git ls-tree HEAD upstream/darktable | awk '{print $3}')
          for f in src/common/colorspaces_inline_conversions.h src/common/illuminants.h src/common/math.h src/common/dttypes.h \
                   src/common/color_ryb.h src/common/darktable.h src/iop/satcurvergb.c src/iop/colorharmonizer.c; do
            mkdir -p "/tmp/p2j-src/$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "/tmp/p2j-src/$f" "https://raw.githubusercontent.com/darktable-org/darktable/$PIN/$f" \
              || { echo "could not download $f at $PIN"; exit 1; }
          done
          python3 -I tools/colorharmonizer-hue-tables.py /tmp/p2j-src --check 2>/dev/null
          python3 -I tools/colorharmonizer-hue-tables.py /tmp/p2j-src --samples 2>/dev/null | diff - app/schema/src/test/resources/p2j-harmonizer-samples.json
          python3 -I tools/p2j-reference-vectors.py /tmp/p2j-src 2>/dev/null | diff - app/schema/src/test/resources/p2j-reference.json
          echo "P2j reference values and tables match upstream at $PIN"

      - name: P3a crop reference values are upstream's (brief P3a)
        timeout-minutes: 10
        run: |
          set -o pipefail
          PIN=$(git ls-tree HEAD upstream/darktable | awk '{print $3}')
          for f in src/iop/crop.c src/iop/ashift.c src/common/math.h; do
            mkdir -p "/tmp/p3a-src/$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "/tmp/p3a-src/$f" "https://raw.githubusercontent.com/darktable-org/darktable/$PIN/$f" \
              || { echo "could not download $f at $PIN"; exit 1; }
          done
          DT_UPSTREAM_COMMIT="$PIN" python3 -I tools/p3a-crop-reference.py /tmp/p3a-src | diff - app/schema/src/test/resources/p3a-crop-reference.json
          echo "P3a crop reference values match src/iop/crop.c and ashift.c at $PIN"

      - name: Controls still waiting for a parameter binding are the listed ones (brief P2j)
        run: |
          python3 -I tools/schema-unbound-controls.py "scene-referred (sigmoid)" "modules: all" \
            --check docs/experiments/P2j-results/unbound-controls-modules-all.txt

      - name: Rule check (literal colours, sizes, icon drawings in screen code)
        id: rules
        run: |
          cd app
          "$GRADLE" --no-daemon -Dorg.gradle.workers.max=4 :checkScreenRulesSelfTest :checkScreenRules 2>&1 | tee /tmp/rules.log

      - name: Gradle dependency cache (Maven Central answers 429 when p2a and p2b fetch the same jars at once)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.m2/repository
          key: gradle-deps-${{ hashFiles('app/**/*.gradle.kts', 'app/**/libs.versions.toml') }}
          restore-keys: gradle-deps-

      - name: Unit and screenshot tests
        id: tests
        run: |
          set +e
          start=$(date +%s)
          cd app
          "$GRADLE" --no-daemon -Dorg.gradle.workers.max=4 --continue \
            :engine-api:test :schema:test :ui-theme:testDebugUnitTest :darkroom:testDebugUnitTest 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          python3 -I ../tools/app/test-summary.py . | tee /tmp/test-summary.txt
          exit 0

      - name: Build the interface preview APK
        id: build
        run: |
          cd app
          "$GRADLE" --no-daemon -Dorg.gradle.workers.max=4 -Pdta.versionName="$PREVIEW_TAG" $DTA_KEYSTORE_ARG :app:assembleDebug 2>&1 | tee /tmp/gradle.log
          mkdir -p /home/runner/out
          cp app/build/outputs/apk/debug/app-debug.apk /home/runner/out/dt-android-preview-arm64-v8a.apk

      - name: Check the APK
        run: |
          A=/home/runner/out/dt-android-preview-arm64-v8a.apk
          R=/home/runner/out/apk-report.txt
          {
            echo "tag: $PREVIEW_TAG"; echo "commit: $GITHUB_SHA"
            echo "apk_bytes $(stat -c %s "$A")"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$A" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion|native-code" || true
            # brief P2e: the preview has its own id; app.dtandroid is the real-engine app
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$A" | grep -q "^package: name='app.dtandroid.preview' " || { echo "application id is not app.dtandroid.preview"; exit 1; }
            echo "permissions:"; "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$A" | sed 's/^/  /'
            echo "packed data:"; unzip -l "$A" | grep -E "dtandroid/(schema|theme)" | sed 's/^/  /'
            echo "signature:"; "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" | grep -E "Signer #1 certificate (DN|SHA-256)" | sed 's/^/  /'
          } | tee "$R"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$A" | grep -q 'android.permission.INTERNET'; then echo "INTERNET permission in APK"; exit 1; fi
          # native code: only what androidx brings (no engine yet); no keystores, no photos
          echo "native libraries:" | tee -a "$R"; unzip -l "$A" | grep -E '\.so$' | sed 's/^/  /' | tee -a "$R"
          if unzip -l "$A" | grep -E '\.so$' | grep -v 'libandroidx\.'; then echo "native library not from androidx in APK"; exit 1; fi
          if unzip -l "$A" | grep -iE '\.(jks|keystore|raf|cr2|nef|arw|dng|jpg|jpeg)$'; then echo "unexpected file in APK"; exit 1; fi
          unzip -l "$A" | grep -q "dtandroid/schema/ui-schema.json" || { echo "schema not packed"; exit 1; }
          unzip -l "$A" | grep -q "dtandroid/schema/builtin-layouts.json" || { echo "built-in layouts not packed"; exit 1; }

      - name: Screenshots
        if: always()
        run: |
          mkdir -p /home/runner/out/screenshots
          cp app/darkroom/build/outputs/screenshots/*.png /home/runner/out/screenshots/ 2>/dev/null || true
          ls -l /home/runner/out/screenshots

      - name: Publish the APK and the screenshots as release files
        if: steps.tests.outputs.rc == '0'
        run: |
          cd /home/runner/out
          cp /tmp/test-summary.txt test-summary.txt
          gh release view -R "$GITHUB_REPOSITORY" "$PREVIEW_TAG" >/dev/null 2>&1 || \
            gh release create -R "$GITHUB_REPOSITORY" "$PREVIEW_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Interface preview $PREVIEW_TAG" \
              --notes "Interface preview (briefs P2a and P2d: darkroom and darktable module layouts), built from commit $GITHUB_SHA: the darkroom interface on a stand-in engine with a generated picture. Speed and image quality mean nothing yet. Unofficial port of darktable, debug build, not a darktable release. Phone: dt-android-preview-arm64-v8a.apk. Screenshots: the .png files. Source: this repository at that commit (GPL-3.0-or-later)." || true
          gh release upload -R "$GITHUB_REPOSITORY" "$PREVIEW_TAG" dt-android-preview-arm64-v8a.apk apk-report.txt test-summary.txt screenshots/*.png --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p2a-preview
          path: /home/runner/out
          retention-days: 14

      - name: Collect logs
        if: always()
        run: |
          L=/tmp/ci-out; mkdir -p "$L"
          {
            echo "tag: $PREVIEW_TAG"
            echo "tests_exit: ${{ steps.tests.outputs.rc }}"
            echo "tests_seconds: ${{ steps.tests.outputs.seconds }}"
            cat /tmp/signing.txt 2>/dev/null || true
            echo "runner_cores: $(nproc)"
          } > "$L/summary.txt"
          cp /tmp/test-summary.txt /tmp/rules.log /tmp/layouts-check.log "$L/" 2>/dev/null || true
          mkdir -p "$L/p2d"; cp app/*/build/reports/p2d/*.md "$L/p2d/" 2>/dev/null || true
          cp /home/runner/out/apk-report.txt "$L/" 2>/dev/null || true
          tail -n 300 /tmp/tests.log > "$L/tests.tail.log" 2>/dev/null || true
          tail -n 100 /tmp/gradle.log > "$L/gradle.tail.log" 2>/dev/null || true
          mkdir -p "$L/screenshots" "$L/test-results"
          cp /home/runner/out/screenshots/*.png "$L/screenshots/" 2>/dev/null || true
          for d in app/*/build/test-results; do
            m=$(basename "$(dirname "$(dirname "$d")")"); mkdir -p "$L/test-results/$m"
            find "$d" -name 'TEST-*.xml' -exec cp {} "$L/test-results/$m/" \; 2>/dev/null || true
          done

      - name: Push logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/ci/push-ci-logs.sh /tmp/ci-out p2a-app "${{ job.status }}-tests${{ steps.tests.outputs.rc }}"

      - name: Fail if a test failed
        if: steps.tests.outputs.rc != '0'
        run: exit 1
