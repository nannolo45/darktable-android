<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M1 Refined, darkroom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e8e8e8}a:hover{color:#f5f5f5}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 36px; background: #161616; color: #c4c4c4; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; display: flex; flex-direction: column; box-shadow: 0 0 0 1px #333333">

  <div style="flex: 0 0 auto; padding: 18px 8px 4px 4px; display: flex; align-items: center; gap: 4px">
    <button onClick="{{goBack}}" aria-label="Back to the working set" style="flex: 0 0 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c4c4c4; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <button onClick="{{toggleFilm}}" aria-expanded="{{film}}" aria-label="{{filmLabel}}" style="flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 4px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 4px">
      <span style="flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="color: #e8e8e8; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{fileName}}</span>
        <span style="color: #a3a3a3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">harbour at dusk · {{seriesPos}} of 12</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; transform: rotate({{filmRot}})"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button onClick="{{toggleCompare}}" aria-pressed="{{compare}}" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: {{cmpBg}}; color: {{cmpColor}}; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">before</button>
    <a href="M1-Export.dc.html" aria-label="Export this photo" style="flex: 0 0 44px; height: 44px; border-radius: 8px; color: #c4c4c4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M7.5 8.5L12 4l4.5 4.5"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></a>
    <button onClick="{{goDone}}" style="flex: 0 0 auto; height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: #e8e8e8; color: #161616; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">done</button>
  </div>

  <div style="flex: 0 0 auto; height: 250px; box-sizing: border-box; padding: 8px; background: #737373; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; height: 100%; max-width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #000000">
      <div style="position: absolute; inset: 0; filter: {{L.filter}}; background: {{photoBg}}"></div>
      <div style="position: absolute; inset: 0; background: {{L.warm}}; opacity: {{L.warmOp}}; mix-blend-mode: soft-light"></div>
      <sc-if value="{{pickerOn}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" style="position: absolute; left: 46%; top: 38%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 1.5px solid #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.7)"></div>
      </sc-if>
    </div>
  </div>

  <div role="status" style="flex: 0 0 auto; height: 28px; display: flex; align-items: center; justify-content: center; color: #a3a3a3; font-size: 12px; font-variant-numeric: tabular-nums">{{infoLine}}</div>

  <sc-if value="{{film}}" hint-placeholder-val="{{false}}">
    <div class="hs" style="flex: 0 0 auto; height: 60px; padding: 8px; box-sizing: border-box; background: #1e1e1e; border-top: 1px solid #333333; border-bottom: 1px solid #333333; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="12">
        <button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-current="{{t.sel}}" style="flex: 0 0 44px; height: 44px; padding: 0; border: 2px solid {{t.ring}}; border-radius: 6px; background: {{t.bg}}; cursor: pointer"></button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isModules}}" hint-placeholder-val="{{true}}">
    <div class="hs" style="flex: 0 0 auto; height: 45px; box-sizing: border-box; display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #333333; padding: 0 4px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
        <button onClick="{{g.pick}}" aria-pressed="{{g.sel}}" aria-label="{{g.aria}}" style="flex: 0 0 auto; position: relative; min-width: 44px; height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{g.color}}; font-family: inherit; font-size: 14px; font-weight: {{g.fw}}; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap">
          <sc-if value="{{g.isPower}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v8"></path><path d="M7.5 6.5a7 7 0 1 0 9 0"></path></svg></sc-if>
          {{g.label}}
          <span style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 1px; background: {{g.bar}}"></span>
        </button>
      </sc-for>
    </div>
    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto">
      <sc-if value="{{isQuick}}" hint-placeholder-val="{{false}}">
        <div style="padding: 4px 16px 8px; background: #1e1e1e; border-bottom: 1px solid #333333; display: flex; flex-direction: column">
          <sc-for list="{{quick}}" as="p" hint-placeholder-count="5">
            <div style="position: relative; height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 10px">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px">
                <label for="{{p.id}}" style="color: #c4c4c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.l}}</label>
                <span style="color: #e8e8e8; font-variant-numeric: tabular-nums; white-space: nowrap">{{p.txt}}</span>
              </div>
              <div style="position: relative; height: 4px; border-radius: 2px; background: #3a3a3a">
                <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{p.pos}}; border-radius: 2px; background: #8c8c8c"></span>
                <span style="position: absolute; left: {{p.pos}}; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: {{p.accent}}; box-shadow: 0 0 0 2px #1e1e1e"></span>
              </div>
              <input id="{{p.id}}" type="range" min="{{p.min}}" max="{{p.max}}" step="{{p.step}}" value="{{p.v}}" onChange="{{p.set}}" onDoubleClick="{{p.reset}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-for list="{{mods}}" as="m" hint-placeholder-count="5">
        <div style="border-bottom: 1px solid #333333">
          <div style="display: flex; align-items: center; height: 48px; padding-right: 4px; background: {{m.headBg}}">
            <sc-if value="{{m.canSwitch}}" hint-placeholder-val="{{true}}">
              <button onClick="{{m.toggle}}" aria-label="{{m.pwLabel}}" aria-pressed="{{m.on}}" style="flex: 0 0 48px; height: 48px; padding: 0; border: 0; background: transparent; color: {{m.pwColor}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v8"></path><path d="M7.5 6.5a7 7 0 1 0 9 0"></path></svg></button>
            </sc-if>
            <sc-if value="{{m.noSwitch}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="flex: 0 0 48px; height: 48px"></span>
            </sc-if>
            <button onClick="{{m.expand}}" aria-expanded="{{m.open}}" style="flex: 1 1 auto; min-width: 0; height: 48px; padding: 0; border: 0; background: transparent; color: {{m.nameColor}}; font-family: inherit; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden">
              <span>{{m.name}}</span>
              <span style="color: #a3a3a3; font-size: 13px; font-weight: 400; overflow: hidden; text-overflow: ellipsis">{{m.suffix}}</span>
            </button>
            <sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
              <button onClick="{{m.openInst}}" aria-label="{{m.instLabel}}" style="flex: 0 0 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c4c4c4; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="11" height="11" rx="2"></rect><path d="M9 8V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg></button>
              <button onClick="{{m.reset}}" aria-label="{{m.resetLabel}}" style="flex: 0 0 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c4c4c4; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.2-5.1"></path><path d="M5 4v4h4"></path></svg></button>
              <button onClick="{{m.openPresets}}" aria-label="{{m.presetLabel}}" style="flex: 0 0 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #c4c4c4; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
            </sc-if>
          </div>
          <sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
            <div style="background: #1e1e1e; padding-bottom: 8px; display: flex; flex-direction: column">
              <sc-if value="{{m.hasTabs}}" hint-placeholder-val="{{false}}">
                <div class="hs" style="display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 4px; border-bottom: 1px solid #333333">
                  <sc-for list="{{m.tabs}}" as="tb" hint-placeholder-count="3">
                    <button onClick="{{tb.pick}}" aria-pressed="{{tb.sel}}" style="flex: 0 0 auto; position: relative; min-width: 44px; height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{tb.color}}; font-family: inherit; font-size: 13px; font-weight: {{tb.fw}}; cursor: pointer; white-space: nowrap">
                      {{tb.label}}
                      <span style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 1px; background: {{tb.bar}}"></span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
              <div style="padding: 0 16px; display: flex; flex-direction: column">
                <sc-for list="{{m.ctrls}}" as="c" hint-placeholder-count="4">
                  <sc-if value="{{c.isSlider}}" hint-placeholder-val="{{true}}">
                    <div style="display: flex; align-items: center; gap: 4px; height: 52px">
                      <div style="position: relative; flex: 1 1 auto; min-width: 0; height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 10px">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px">
                          <label for="{{c.id}}" style="color: #c4c4c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.l}}</label>
                          <span style="color: #e8e8e8; font-variant-numeric: tabular-nums; white-space: nowrap">{{c.txt}}</span>
                        </div>
                        <div style="position: relative; height: 4px; border-radius: 2px; background: #3a3a3a">
                          <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{c.pos}}; border-radius: 2px; background: #8c8c8c"></span>
                          <span style="position: absolute; left: {{c.pos}}; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: {{c.accent}}; box-shadow: 0 0 0 2px #1e1e1e"></span>
                        </div>
                        <input id="{{c.id}}" type="range" min="{{c.min}}" max="{{c.max}}" step="{{c.step}}" value="{{c.v}}" onChange="{{c.set}}" onDoubleClick="{{c.reset}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
                      </div>
                      <sc-if value="{{c.hasPicker}}" hint-placeholder-val="{{false}}">
                        <button onClick="{{c.pick}}" aria-pressed="{{c.pickOn}}" aria-label="{{c.pickLabel}}" style="flex: 0 0 44px; height: 44px; margin-right: -8px; padding: 0; border: 0; border-radius: 8px; background: {{c.pickBg}}; color: {{c.pickColor}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5l3 3"></path><path d="M16 5l1.5-1.5a2.1 2.1 0 0 1 3 3L19 8"></path><path d="M15.5 8.5L7 17l-3 1 1-3 8.5-8.5"></path></svg></button>
                      </sc-if>
                    </div>
                  </sc-if>
                  <sc-if value="{{c.isList}}" hint-placeholder-val="{{false}}">
                    <button onClick="{{c.openList}}" aria-haspopup="dialog" aria-label="{{c.aria}}" style="height: 48px; padding: 0; border: 0; background: transparent; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
                      <span style="color: #c4c4c4; font-size: 13px; white-space: nowrap">{{c.l}}</span>
                      <span style="min-width: 0; height: 32px; padding: 0 8px 0 12px; border-radius: 8px; background: #262626; color: #e8e8e8; font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden">
                        <span style="overflow: hidden; text-overflow: ellipsis">{{c.txt}}</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M6 9l6 6 6-6"></path></svg>
                      </span>
                    </button>
                  </sc-if>
                  <sc-if value="{{c.isSwitch}}" hint-placeholder-val="{{false}}">
                    <label style="position: relative; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #c4c4c4; cursor: pointer">
                      <span>{{c.l}}</span>
                      <span aria-hidden="true" style="flex: 0 0 auto; width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 1.5px solid {{c.boxBorder}}; background: {{c.boxBg}}; display: flex; align-items: center; justify-content: center">
                        <sc-if value="{{c.on}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
                      </span>
                      <input type="checkbox" checked="{{c.on}}" onChange="{{c.set}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
                    </label>
                  </sc-if>
                  <sc-if value="{{c.isSection}}" hint-placeholder-val="{{false}}">
                    <div style="height: 36px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; border-bottom: 1px solid #333333; color: #a3a3a3; font-size: 12px; font-weight: 500; letter-spacing: .02em">{{c.l}}</div>
                  </sc-if>
                  <sc-if value="{{c.isNote}}" hint-placeholder-val="{{false}}">
                    <span style="padding: 12px 0; color: #a3a3a3; font-size: 13px; line-height: 1.5">{{c.text}}</span>
                  </sc-if>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{emptyGroup}}" hint-placeholder-val="{{false}}">
        <div style="padding: 20px 16px; color: #a3a3a3; font-size: 13px; line-height: 1.5">No module is active at this point in the history.</div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isHistory}}" hint-placeholder-val="{{false}}">
    <div style="flex: 0 0 auto; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #333333">
      <button onClick="{{undo}}" disabled="{{undoDis}}" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #262626; color: {{undoColor}}; font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>undo</button>
      <button onClick="{{redo}}" disabled="{{redoDis}}" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #262626; color: {{redoColor}}; font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>redo</button>
      <button onClick="{{compress}}" style="flex: 1 1 auto; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #262626; color: #e8e8e8; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap">compress history stack</button>
    </div>
    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto">
      <sc-for list="{{histRows}}" as="h" hint-placeholder-count="8">
        <button onClick="{{h.go}}" aria-current="{{h.sel}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 16px; border: 0; border-bottom: 1px solid #333333; background: {{h.bg}}; color: {{h.color}}; font-family: inherit; font-size: 14px; font-weight: {{h.fw}}; text-align: left; cursor: pointer">
          <span style="flex: 0 0 22px; font-size: 13px; font-variant-numeric: tabular-nums; color: {{h.numColor}}">{{h.n}}</span>
          <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.name}}</span>
          <span style="flex: 0 0 auto; font-size: 12px; color: {{h.numColor}}">{{h.note}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="flex: 0 0 auto; height: 60px; padding-bottom: 10px; box-sizing: border-box; border-top: 1px solid #333333; display: flex">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
      <button onClick="{{v.pick}}" aria-pressed="{{v.sel}}" style="flex: 1 1 0; position: relative; border: 0; background: transparent; color: {{v.color}}; font-family: inherit; font-size: 14px; font-weight: {{v.fw}}; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">
        {{v.label}}
        <span style="color: {{v.countColor}}; font-size: 13px; font-variant-numeric: tabular-nums">{{v.count}}</span>
        <span style="position: absolute; left: 50%; top: 0; width: 32px; margin-left: -16px; height: 2px; border-radius: 1px; background: {{v.bar}}"></span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 72px; padding: 12px 14px; border-radius: 8px; background: #262626; box-shadow: 0 0 0 1px #333333; color: #e8e8e8; font-size: 13px; line-height: 1.4">{{toast}}</div>
  </sc-if>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button onClick="{{closeMenu}}" aria-label="Close menu" style="position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: rgba(0,0,0,.55); cursor: pointer"></button>
    <div role="dialog" aria-label="{{sheetTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 640px; box-sizing: border-box; padding: 8px 16px 28px; border-radius: 8px 8px 0 0; background: #1e1e1e; box-shadow: 0 -1px 0 #333333; display: flex; flex-direction: column">
      <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #4a4a4a"></span>
      <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px">
        <span style="color: #e8e8e8; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sheetTitle}}</span>
        <button onClick="{{closeMenu}}" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #c4c4c4; font-family: inherit; font-size: 13px; cursor: pointer">close</button>
      </div>
      <sc-if value="{{notRename}}" hint-placeholder-val="{{true}}">
        <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">
          <sc-for list="{{sheetItems}}" as="it" hint-placeholder-count="6">
            <button onClick="{{it.run}}" disabled="{{it.dis}}" style="flex: 0 0 auto; height: 48px; padding: 0 2px; border: 0; border-top: 1px solid #333333; background: transparent; color: {{it.color}}; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <span>{{it.label}}</span>

      undoColor: S.hpos <= 0 ? '#8f8f8f' : '#e8e8e8', redoColor: S.hpos >= S.steps.length ? '#8f8f8f' : '#e8e8e8',
      undo: function () { var h = self.state.hpos; if (h > 0) set({ hpos: h - 1 }); },
      redo: function () { var now = self.state; if (now.hpos < now.steps.length) set({ hpos: now.hpos + 1 }); },
      compress: function () {
        var now = self.state, h = now.hpos, fin = now.snaps[h], orig = now.snaps[0], order = [];
        now.steps.slice(0, h).forEach(function (s) { var j = order.indexOf(s.uid); if (j >= 0) order.splice(j, 1); order.push(s.uid); });
        var inFin = {}, inOrig = {};
        fin.forEach(function (y) { inFin[y.uid] = y; });
        orig.forEach(function (y) { inOrig[y.uid] = y; });
        order = order.filter(function (u) { return inFin[u]; });
        var touched = {}, done = {}, snaps = [orig], steps = [];
        order.forEach(function (u) { touched[u] = true; });
        order.forEach(function (u) {
          done[u] = true;
          var snap = [];
          fin.forEach(function (y) {
            if (!touched[y.uid] || done[y.uid]) snap.push(y);
            else if (inOrig[y.uid]) snap.push(inOrig[y.uid]);
          });
          snaps.push(self.copy(snap));
          steps.push({ uid: u, name: self.full(inFin[u]), note: inFin[u].on ? 'on' : 'off', key: null });
        });
        set({ snaps: snaps, steps: steps, hpos: steps.length });
      },
      views: [['modules', ''], ['history', String(S.hpos)]].map(function (v) {
        var sel = S.view === v[0];
        return {
          label: v[0], count: v[1], sel: sel, color: sel ? '#f5f5f5' : '#a3a3a3', countColor: sel ? '#c4c4c4' : '#a3a3a3',
          fw: sel ? 500 : 400, bar: sel ? accent : 'transparent',
          pick: function () { set({ view: v[0], menu: null }); }
        };
      }),
      toastOn: !!S.toast, toast: S.toast,
      sheetOpen: !!mx, sheetTitle: sheetTitle, sheetItems: sheetItems,
      isRename: !!mx && S.menu.kind === 'rename', notRename: !(mx && S.menu.kind === 'rename'),
      renameVal: S.rename, renameInput: function (e) { set({ rename: e.target.value }); },
      saveRename: function () {
        var now = self.state, uid = now.menu.uid, name = (now.rename || '').trim(), a = cur();
        a.forEach(function (y) { if (y.uid === uid) y.label = name; });
        self.commit(a, uid, 'renamed', null, { menu: null });
      },
      closeMenu: function () { set({ menu: null }); }
    };
  }
}
