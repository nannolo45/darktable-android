<!-- LightPhotoLibrary's own icon: three photos and a sun. The same drawing as the web application's
     icon, on a 512 box. Its colours are LightPhotoLibrary's mark, not theme tokens, so they are written
     here and nowhere else; :lpl-shell:shellIcons turns this file into the launcher icon. -->
<!-- background: #18181a -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="134" y="134" width="112" height="112" rx="20" fill="#e2e2e4"/>
  <rect x="134" y="266" width="112" height="112" rx="20" fill="#6e6e76"/>
  <rect x="266" y="266" width="112" height="112" rx="20" fill="#e2e2e4"/>
  <circle cx="322" cy="190" r="56" fill="#E8A33D"/>
</svg>
